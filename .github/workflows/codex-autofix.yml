name: Auto Fix Code

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autofix:
    if: github.event.pull_request.head.repo.fork == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Run Codex to fix linting issues
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Analyze the codebase and fix linting errors only.
            Keep business logic unchanged.

      - name: Commit fixes (if any)
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: auto-fix lint issues"
          git push origin HEAD:${{ github.head_ref }}
